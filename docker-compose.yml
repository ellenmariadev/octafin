services:
  db:
    image: postgres:16-alpine
    container_name: octafin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-octafin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-octafin}
      POSTGRES_DB: ${POSTGRES_DB:-octafin}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-octafin} -d ${POSTGRES_DB:-octafin}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: octafin-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-octafin}:${POSTGRES_PASSWORD:-octafin}@db:5432/${POSTGRES_DB:-octafin}?schema=public
      PORT: 3000
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: octafin-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - '${WEB_PORT:-3001}:3000'
    depends_on:
      - api

volumes:
  db_data:
